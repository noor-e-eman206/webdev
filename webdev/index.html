 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EduWorld</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #1c2b4a;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        .btn {
            display: inline-block;
            background: #7c4dff;
            color: white;
            padding: 10px 10px;
            border-radius: 10px ;
        }     
        /* FORM AND AUDIO */
        .bottom {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
            padding: 20px 20px 20px;
        }

        .panel {
            background: white;
            padding: 15px;
            border: 1px solid grey;
            border-radius: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        .field {
            margin-bottom: 12px;
        }

        .field > label, .field > .label {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        select,
        textarea {
            max-width: 100%;
            padding: 5px;
            border: 2px solid grey;
            border-radius: 4px;
        }

        .listen audio, .listen img {
            width: 100%;
            margin-bottom: 20px;
        }

        .listen img {
            height: 130px;
            object-fit: cover;
        }

      
        /* MOBILE VIEW */
        @media (max-width: 800px) {
            header {
                flex-direction: column;
            }

            nav ul {
                gap: 12px;
                flex-wrap: wrap;
            }

            .courses, .cards, .bottom, .form-grid {
                grid-template-columns:1fr ;
            }
        }
    </style>
</head>

<body>

 <section class="bottom" id="contact">

            <div class="panel">
                <h3>Registration Form</h3>

                <form action="#" method="post">

                    <div class="form-grid">
                        <div>
                            <div class="field">
                                <label for="name">Full Name:</label>
                                <input type="text" id="name"
                                       placeholder="Enter your name">
                            </div>

                            <div class="field">
                                <label for="email">Email:</label>
                                <input type="email" id="email"
                                       placeholder="Enter your email">
                            </div>

                            <div class="field">
                                <label for="password">Password:</label>
                                <input type="password" id="password"
                                       placeholder="Enter password">
                            </div>
                        </div>

                        <div>
                            <div class="field">
                                <span class="label">Gender:</span>
                                <label>
                                    <input type="radio" name="gender" value="male">
                                    Male
                                </label>
                                <label>
                                    <input type="radio" name="gender" value="female">
                                    Female
                                </label>
                            </div>

                            <div class="field">
                                <label for="dept">Department:</label>
                                <select id="dept">
                                    <option>Select Department</option>
                                    <option>CS</option>
                                    <option>SE</option>
                                    <option>IT</option>
                                </select>
                            </div>

                            <div class="field">
                                <span class="label">Courses:</span><br>
                                <label><input type="checkbox"> WebTechnologies</label><br>
                                <label><input type="checkbox"> DatabaseSystems</label><br>
                                <label><input type="checkbox"> Programming</label>
                            </div>
                        </div>
                    </div>

                    <div class="field">
                        <label for="msg">Message:</label>
                        <textarea id="msg" rows="1"
                                  placeholder="Write your message"></textarea>
                    </div>

                    <button type="submit" class="btn">Register</button>
                    <button type="reset" class="btn">Reset</button>

                </form>
            </div>

            <div class="panel listen">
                <h3>Listen to Our Message</h3>
                      
                <audio controls>
                    <source src="section.mp3" type="audio/mp3">
                </audio>


                <img src="sectionpic.jpg" alt="EduWorld campus building">

                <h4>Welcome to EduWorld!</h4>
                <p>Join us and be a part of something great.</p>
            </div>

  </section>
</body>
</html>
